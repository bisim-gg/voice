name: Release

# Publishes @bisim/voice to npm when a tag v<version> is pushed (for example v0.1.0), then makes its GitHub release.
#
# This uses npm trusted publishing (OIDC): no npm token is stored anywhere. npm only lets a trusted publisher be
# added to a package that exists, so the very first version goes out by hand; then open the package settings on
# npmjs.com and add a trusted publisher of type GitHub Actions with
#   organization or user: bisim-gg
#   repository:           voice
#   workflow filename:    release.yml
# Without that, the publish step below is refused.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing) and sign the provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@latest

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A version that is already on npm (for example one published by hand before the trusted publisher existed) is
      # left alone, so its tag still gets its GitHub release.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@bisim/voice@${version}" version >/dev/null 2>&1; then
            echo "@bisim/voice ${version} is already on npm"
          else
            npm publish --provenance --access public
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "@bisim/voice ${GITHUB_REF_NAME#v}"
          --generate-notes
